<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Reviews - Mr. Barber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .review-card {
      background-color: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .review-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .star-rating i {
      color: #ffc107;
    }
    .form-control:focus {
      border-color: #000000;
      box-shadow: none;
    }
    .submit-btn {
      background-color: #000000;
      color: white;
    }
  </style>
</head>
<body>

<div class="container py-5">

  <h2 class="text-center mb-4">Customer Reviews</h2>

  <!-- Submit Review Section -->
  <div class="review-card">
    <h5>Leave a Review</h5>
    <form>
      <div class="mb-3">
        <label for="reviewText" class="form-label">Your Feedback</label>
        <textarea class="form-control" id="reviewText" rows="3" placeholder="Share your experience..."></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Your Rating</label>
        <div class="star-rating">
          <i class="fas fa-star" data-value="1"></i>
          <i class="fas fa-star" data-value="2"></i>
          <i class="fas fa-star" data-value="3"></i>
          <i class="fas fa-star" data-value="4"></i>
          <i class="fas fa-star" data-value="5"></i>
        </div>
      </div>
      <button type="submit" class="btn submit-btn">Submit Review</button>
    </form>
  </div>

  <!-- Existing Reviews -->
  <div class="review-card">
    <div class="d-flex align-items-center mb-2">
      <img src="https://i.pravatar.cc/50?img=5" alt="Avatar" class="review-avatar me-3">
      <div>
        <h6 class="mb-0">Nuwan Perera</h6>
        <div class="star-rating">
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star-half-alt"></i>
        </div>
      </div>
    </div>
    <p class="mb-0">Great atmosphere and very professional service! Highly recommend Ramesh for beard trims.</p>
  </div>

  <div class="review-card">
    <div class="d-flex align-items-center mb-2">
      <img src="https://i.pravatar.cc/50?img=8" alt="Avatar" class="review-avatar me-3">
      <div>
        <h6 class="mb-0">Shanika Fernando</h6>
        <div class="star-rating">
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="far fa-star"></i>
        </div>
      </div>
    </div>
    <p class="mb-0">Lovely place with friendly staff. Booking through the app is super easy!</p>
  </div>

</div>

<!-- Bootstrap JS and Font Awesome -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Optional JS for star rating interaction
  const stars = document.querySelectorAll(".star-rating i");
  stars.forEach((star, index) => {
    star.addEventListener("click", () => {
      stars.forEach((s, i) => {
        s.className = i <= index ? "fas fa-star" : "far fa-star";
      });
    });
  });
</script>
</body>
</html>
