<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment - Mr. Barber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .payment-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      margin-top: 50px;
    }
    .payment-card .form-label {
      font-weight: 500;
    }
    .summary-box {
      background-color: #cad5d8;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .btn-primary {
      background-color: #000000;
      border-color: #000000;
    }
    .btn-primary:hover {
      background-color: #000000;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="payment-card">
        <h3 class="text-center mb-4">Payment Details</h3>

        <div class="summary-box mb-4">
          <h5>Service Summary</h5>
          <p class="mb-1"><strong>Service:</strong> Haircut + Beard Trim</p>
          <p class="mb-1"><strong>Barber:</strong> Shane Fernando</p>
          <p class="mb-1"><strong>Date:</strong> April 18, 2025 at 4:00 PM</p>
          <p class="mb-0"><strong>Total:</strong> Rs. 2,500.00</p>
        </div>

        <form id="paymentForm">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name (as on card)</label>
            <input type="text" class="form-control" id="fullName" required />
          </div>
          <div class="mb-3">
            <label for="cardNumber" class="form-label">Card Number</label>
            <input type="text" class="form-control" id="cardNumber" maxlength="19" placeholder="xxxx xxxx xxxx xxxx" required />
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="expiryDate" class="form-label">Expiry Date</label>
              <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" required />
            </div>
            <div class="col-md-6">
              <label for="cvv" class="form-label">CVV</label>
              <input type="text" class="form-control" id="cvv" maxlength="4" placeholder="123" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Pay Now</button>
        </form>

        <div class="text-center mt-3">
          <small class="text-muted">Secure payment powered by Mr. Barber</small>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap + JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('paymentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Payment Successful! Thank you for booking with Mr. Barber.');
    // You can redirect or handle payment logic here
  });
</script>

</body>
</html>
