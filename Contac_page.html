<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Mr. Barber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
      color: #000;
    }
    .navbar {
      background-color: #000;
    }
    .navbar-brand, .navbar-nav .nav-link {
      color: #fff !important;
    }
    .container {
      margin-top: 30px;
    }
    .card-header {
      background-color: #343a40;
      color: white;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    .form-control, .btn {
      border-radius: 5px;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .btn-contact {
      background-color: #343a40;
      color: white;
    }
    .btn-contact:hover {
      background-color: #5a6268;
    }
    .map-container {
      position: relative;
      overflow: hidden;
      padding-bottom: 56.25%;
      height: 0;
      margin-top: 20px;
    }
    .map-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    footer {
    text-align: center;
    padding: 1rem;
    background-color: #111;
    color: #fff;
    margin-top: 2rem;
  }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><i class="fas fa-cut"></i> Mr. Barber</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about-us.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="contact-us.html">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container">

  <!-- Contact Form Section -->
  <div class="row mb-5">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5>Contact Us</h5>
        </div>
        <div class="card-body">
          <form>
            <div class="form-group">
              <label for="name">Your Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
              <label for="email">Your Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
              <label for="message">Your Message</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-contact mt-3">Send Message</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Contact Information Section -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5>Our Location</h5>
        </div>
        <div class="card-body">
          <p><strong>Address:</strong> 123 Main Street, Colombo 3, Sri Lanka</p>
          <p><strong>Phone:</strong> +94 712 345 678</p>
          <p><strong>Email:</strong> contact@mrbarber.com</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Google Map Section -->
  <div class="map-container">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3943.4542111079085!2d79.98177891415093!3d6.927078520078758!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae258d6f68f4a11%3A0x4e7971228d40c11d!2s123%20Main%20Street%2C%20Colombo%203%2C%20Sri%20Lanka!5e0!3m2!1sen!2sus!4v1683052766474!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  
</div>

<footer>
    <p>&copy; 2025 Mr. Barber. All rights reserved.</p>
  </footer>

<!-- Bootstrap Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
